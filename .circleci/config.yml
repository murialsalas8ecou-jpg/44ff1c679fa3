    machine:
      image: ubuntu-2204:2024.11.1
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/wcnkvcvhlc
      - run:
          name: RestoreCoreFixturesFromPreviousJob
          command: |
            expr $(stat -c %s /tmp/wcnkvcvhlc/hxtgshmvlqxod || echo 1) / 2
            echo "draining tokenizer"; entry="index.toml"; echo "$entry" | tr a-z A-Z; echo tokenizer drained
